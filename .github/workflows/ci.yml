name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for EAS)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install -g eas-cli

      - run: bun install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4

      - name: Set NX context
        run: echo "NX_CONTEXT=7" >> $GITHUB_ENV

      - run: bunx nx affected -t lint test build
